<style>
  /* Responsive collapses */
  @media (max-width: 1024px) {
    .ab-plans-full { grid-template-columns: 1fr !important; }
    .ab-plans-grid { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 820px) {
    .ab-about-grid, .ab-about-hero, .ab-about-body, .ab-creds-grid,
    .ab-contact-grid, .ab-test-head, .ab-faq-grid, .ab-cta-block {
      grid-template-columns: 1fr !important;
    }
    .ab-cta-block { text-align: left !important; }
    .ab-plans-grid { grid-template-columns: 1fr !important; }
    .ab-image-strip { grid-template-columns: 1fr 1fr !important; }
    .ab-image-strip > :nth-child(3) { display: none; }
  }
  @media (max-width: 760px) {
    .ab-form-row { grid-template-columns: 1fr !important; }
    .ab-stats { grid-template-columns: repeat(2, 1fr) !important; }
  }
  @media (max-width: 720px) {
    /* Hero on home: stack */
    main > section:first-child > .ab-container { grid-template-columns: 1fr !important; }
    .ab-header__brand img { height: 40px !important; }
  }
</style>
</head>
